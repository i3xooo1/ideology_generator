<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NRP Ideology Builder</title>
    <style>
        body {
            background: #0e0e0e;
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #1b1b1b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 0px 15px #000;
        }

        label {
            display: block;
            margin: 15px 0 5px;
            font-size: 18px;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            background: #262626;
            color: white;
        }

        #resultBox {
            margin-top: 25px;
            padding: 15px;
            background: #272727;
            border-left: 5px solid #4caf50;
            border-radius: 6px;
            font-size: 20px;
        }

        .error {
            border-left-color: #ff4444 !important;
            color: #ff7777;
        }
    </style>
</head>

<body>

    <h1>NRP Ideology Generator</h1>

    <div class="container">

        <label>Main Ideology:</label>
        <select id="mainIdeology">
            <option value="Communism">Communism</option>
            <option value="Democracies">Democracies</option>
            <option value="Facism">Facism</option>
        </select>

        <label>Government Type:</label>
        <select id="governmentType">
            <option value="Democracy">Democracy</option>
            <option value="Authoritarianism">Authoritarianism</option>
            <option value="Totalitarianism">Totalitarianism</option>
        </select>

        <label>Economy Type:</label>
        <select id="economyType">
            <option value="Planned">Planned / Command</option>
            <option value="Free">Free Market</option>
        </select>

        <div id="resultBox">
            Your ideology will appear here.
        </div>
    </div>

    <script>
        const ideologyMapping = {
            "Communism": {
                "Democracy": {
                    "Planned": "Democratic Socialism",
                    "Free": "Market Socialism"
                },
                "Authoritarianism": {
                    "Planned": "Marxism-Leninism",
                    "Free": "Dengism"
                },
                "Totalitarianism": {
                    "Planned": "Juche",
                    "Free": "Neo-Juche Market Variant"
                }
            },
            "Democracies": {
                "Democracy": {
                    "Planned": "Social Democracy",
                    "Free": "Liberal Democracy"
                },
                "Authoritarianism": {
                    "Planned": "Illiberal Socialist Democracy",
                    "Free": "Competitive Authoritarianism"
                },
                "Totalitarianism": {
                    "Planned": "ERROR", 
                    "Free": "ERROR"
                }
            },
            "Facism": {
                "Democracy": {
                    "Planned": "Proto-Fascist Syndicalism",
                    "Free": "Populist Ultranationalism"
                },
                "Authoritarianism": {
                    "Planned": "National Syndicalism",
                    "Free": "Corporatist Fascism"
                },
                "Totalitarianism": {
                    "Planned": "Classical Fascism",
                    "Free": "Hyper-Capitalist Fascism"
                }
            }
        };

        function invalidCombo(main, gov) {
            return (main === "Democracies" && gov === "Totalitarianism");
        }

        function generateFallback(main, gov, econ) {
            return `${gov} ${econ} ${main}`;
        }

        function getIdeology(mainIdeology, governmentType, economyType) {

            // ❌ HARD RULE: Democracies cannot be Totalitarian
            if (invalidCombo(mainIdeology, governmentType)) {
                return "Invalid combination: Democracies cannot be Totalitarian.";
            }

            const main = ideologyMapping[mainIdeology];
            if (!main) return generateFallback(mainIdeology, governmentType, economyType);

            const gov = main[governmentType];
            if (!gov) return generateFallback(mainIdeology, governmentType, economyType);

            const result = gov[economyType];
            if (result === "ERROR") {
                return "Invalid combination: Democracies cannot be Totalitarian.";
            }

            return result || generateFallback(mainIdeology, governmentType, economyType);
        }

        function updateResult() {
            const main = document.getElementById("mainIdeology").value;
            const gov = document.getElementById("governmentType").value;
            const econ = document.getElementById("economyType").value;

            const result = getIdeology(main, gov, econ);

            const box = document.getElementById("resultBox");

            if (result.includes("Invalid combination")) {
                box.classList.add("error");
            } else {
                box.classList.remove("error");
            }

            box.innerText = "Final Ideology: " + result;
        }

        document.querySelectorAll("select").forEach(s => {
            s.addEventListener("change", updateResult);
        });

        updateResult();
    </script>

</body>
</html>
